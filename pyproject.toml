[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rising_gods_wizard"
version = "1.0.0"
description = "Rising Gods Linux Wizard — Voll-Python-Rewrite des WoW 3.3.5a Installers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rising Gods Wizard Coder" }]
# Laufzeit-Pflichtabhängigkeiten: keine. whiptail ist ein System-Tool (newt),
# rich ist optional (Display-Backend). Beide werden zur Laufzeit graceful
# degradiert, falls nicht vorhanden (siehe ui/whiptail_ui.py, ui/rich_ui.py).
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0"]
requests = ["requests>=2.28"]

[project.scripts]
rising-gods-wizard = "rising_gods_wizard.__main__:main"

[tool.setuptools]
packages = { find = { include = ["rising_gods_wizard", "rising_gods_wizard.*"] } }

[tool.setuptools.package-data]
rising_gods_wizard = ["templates/*.j2", "assets/*", "bundles/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
